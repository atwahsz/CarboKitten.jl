[project]
name = "carbokitten"
version = "0.1.0"
description = "High-performance Python port of CarboKitten.jl (work in progress)."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "numpy>=1.23",
  "numba>=0.58",
  "h5py>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
